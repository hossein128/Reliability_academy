<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Reliability Academy</title>
<style>
:root{--bg:#f4f2ee;--cd:#fffefb;--tx:#1d2733;--mu:#667180;--a:#1f4e79;--ok:#2f7d4f;--bd:#d9d5cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171a;--cd:#1e2328;--tx:#e8eaed;--mu:#9aa4af;--a:#5aa2f5;--ok:#51cf66;--bd:#2f363d}}
:root[data-theme=dark]{--bg:#14171a;--cd:#1e2328;--tx:#e8eaed;--mu:#9aa4af;--a:#5aa2f5;--ok:#51cf66;--bd:#2f363d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:680px;margin:0 auto;padding:14px}
h1,h2{font-family:Georgia,'Times New Roman',serif;font-weight:600;letter-spacing:.2px}h1{font-size:24px;margin:4px 0}h2{font-size:21px;margin:6px 0}p{margin:8px 0}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:14px;margin:10px 0}
.m{display:flex;gap:10px;align-items:center;cursor:pointer}.m b{display:block}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);flex:none;display:grid;place-items:center;font-size:14px}
.dot.d{background:var(--ok);border-color:var(--ok);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:20px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}

label{display:block;margin:8px 0;font-size:14px}input[type=range]{width:100%}select{width:100%;padding:6px;font:inherit;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:8px}

ul{padding-left:20px;margin:6px 0}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
function lg(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(let j=0;j<6;j++)s+=c[j]/++y;return -t+Math.log(2.5066282746310005*s/x)}
const C=(n,k)=>Math.exp(lg(n+1)-lg(k+1)-lg(n-k+1));
const ex=x=>x.toExponential(2);
const T={
weibull:{in:[['b','Shape β',1.5,.3,4,.1],['e','Scale η (h)',1000,100,5000,100],['t','Time t (h)',500,10,5000,10]],f(v){const{b,e,t}=v,R=Math.exp(-((t/e)**b)),h=b/e*(t/e)**(b-1),m=e*Math.exp(lg(1+1/b));const Rs=[],Hs=[];for(let i=1;i<=40;i++){const x=2*e*i/40;Rs.push(Math.exp(-((x/e)**b)));Hs.push(b/e*(x/e)**(b-1))}
return{o:`R(t)=${R.toFixed(4)} · F(t)=${(1-R).toFixed(4)}<br>h(t)=${ex(h)} /h · MTTF=${m.toFixed(0)} h<br>Phase: ${b<.95?'infant mortality (falling hazard)':b<1.05?'random failures (constant hazard)':'wear-out (rising hazard)'}`,s:[{y:Rs,n:'R(t)',c:'#2a7de1',abs:1},{y:Hs,n:'h(t) scaled',c:'#e8590c'}],x:'time 0 → 2η'}}},
rbd:{in:[['R','Component reliability R',.9,.5,.999,.001],['n','Components n',3,1,8,1],['k','k needed (k-of-n)',2,1,8,1]],f(v){const n=v.n,k=Math.min(v.k,n);const kn=(R)=>{let s=0;for(let i=k;i<=n;i++)s+=C(n,i)*R**i*(1-R)**(n-i);return s};const S=[],P=[],K=[];for(let i=0;i<=30;i++){const r=i/30;S.push(r**n);P.push(1-(1-r)**n);K.push(kn(r))}
return{o:`Series: ${(v.R**n).toFixed(4)}<br>Parallel: ${(1-(1-v.R)**n).toFixed(4)}<br>${k}-of-${n}: ${kn(v.R).toFixed(4)}`,s:[{y:S,n:'series',c:'#e8590c',abs:1},{y:P,n:'parallel',c:'#2a7de1',abs:1},{y:K,n:'k-of-n',c:'#2f9e44',abs:1}],x:'system R vs component R (0→1)'}}},
fmea:{in:[['S','Severity S',8,1,10,1],['O','Occurrence O',4,1,10,1],['D','Detection D (10 = hard to detect)',5,1,10,1],['l','Failure rate λ (per 10⁶ h)',50,1,500,1],['a','Mode ratio α (%)',40,1,100,1]],f(v){const r=v.S*v.O*v.D,cm=v.a/100*v.l*1000/1e6;return{o:`RPN = S×O×D = <b>${r}</b> → ${v.S>=9?'Severity ≥9: act regardless of RPN':r>=200?'High: act now':r>=100?'Medium: plan action':'Low: monitor'}<br>Mode criticality Cm = α·λ·t (t=1000 h) = ${cm.toFixed(4)}`,s:[]}}},
fta:{in:[['a','P(A)',.02,.001,.3,.001],['b','P(B)',.05,.001,.3,.001],['c','P(C)',.03,.001,.3,.001],['g1','Gate on B,C',0,['OR','AND']],['g2','Top gate with A',0,['AND','OR']]],f(v){const F=(a,b,c)=>{const G=v.g1==0?1-(1-b)*(1-c):b*c;return v.g2==0?a*G:1-(1-a)*(1-G)},{a,b,c}=v,P=F(a,b,c);const cs=['{A,B}, {A,C}','{A,B,C}','{A}, {B}, {C}','{A}, {B,C}'][v.g2*2+ +v.g1];
return{o:`P(top event) = <b>${ex(P)}</b><br>Minimal cut sets: ${cs}<br>Birnbaum importance — A: ${ex(F(1,b,c)-F(0,b,c))}, B: ${ex(F(a,1,c)-F(a,0,c))}, C: ${ex(F(a,b,1)-F(a,b,0))}`,s:[]}}},
eta:{in:[['f','Initiating event freq (/yr)',.1,.01,1,.01],['s1','Barrier 1 success',.99,.5,.999,.001],['s2','Barrier 2 success',.9,.5,.999,.001]],f(v){const{f,s1,s2}=v;return{o:`Safe (B1 works): ${ex(f*s1)} /yr<br>Mitigated (B1 fails, B2 works): ${ex(f*(1-s1)*s2)} /yr<br>Accident (both fail): <b>${ex(f*(1-s1)*(1-s2))}</b> /yr`,s:[]}}},
markov:{in:[['l','Failure rate λ (/h)',.01,.001,.1,.001],['m','Repair rate μ (/h)',.1,.01,1,.01],['t','Time t (h)',50,1,500,1]],f(v){const{l,m,t}=v,s=l+m,A=x=>m/s+l/s*Math.exp(-s*x),y=[];for(let i=0;i<=40;i++)y.push(A(5/s*i/40));return{o:`Steady-state A = ${(m/s).toFixed(4)}<br>A(t) = ${A(t).toFixed(4)}<br>MTBF=${(1/l).toFixed(0)} h · MTTR=${(1/m).toFixed(1)} h`,s:[{y,n:'A(t)',c:'#2a7de1',abs:1}],x:'time 0 → 5/(λ+μ)'}}},
bayes:{in:[['a','Prior α',1,.5,10,.5],['b','Prior β',1,.5,10,.5],['n','Units tested n',20,1,100,1],['k','Failures',2,0,100,1]],f(v){const k=Math.min(v.k,v.n),A=v.a+k,B=v.b+v.n-k,mu=A/(A+B),sd=Math.sqrt(A*B/((A+B)**2*(A+B+1)));const pd=(a,b)=>{const y=[];for(let i=0;i<100;i++){const p=(i+.5)/100;y.push(Math.exp((a-1)*Math.log(p)+(b-1)*Math.log(1-p)-lg(a)-lg(b)+lg(a+b)))}return y};
return{o:`Posterior Beta(${A}, ${B})<br>E[failure prob] = ${mu.toFixed(4)} → R ≈ ${(1-mu).toFixed(4)}<br>≈90% interval for p: ${Math.max(0,mu-1.645*sd).toFixed(3)} – ${Math.min(1,mu+1.645*sd).toFixed(3)}`,s:[{y:pd(v.a,v.b),n:'prior (scaled)',c:'#868e96'},{y:pd(A,B),n:'posterior (scaled)',c:'#2a7de1'}],x:'failure probability p (0→1)'}}},
arr:{in:[['E','Activation energy Ea (eV)',.7,.2,1.5,.05],['u','Use temp (°C)',40,10,100,1],['s','Stress temp (°C)',125,60,250,1]],f(v){const AF=Math.exp(v.E/8.617e-5*(1/(+v.u+273.15)-1/(+v.s+273.15)));return{o:`Acceleration factor = <b>${AF.toFixed(1)}</b><br>Test time to mimic 10 years of use ≈ ${(87600/AF).toFixed(0)} h`,s:[]}}},
age:{in:[['b','Shape β',2.5,1.1,5,.1],['e','Scale η (h)',1000,100,5000,100],['r','Cf / Cp cost ratio',5,1.5,20,.5]],f(v){const{b,e,r}=v,N=60,y=[];let I=0,pR=1,best=1e9,bt=0;for(let i=1;i<=N;i++){const T=2*e*i/N,R=Math.exp(-((T/e)**b));I+=(pR+R)/2*(2*e/N);pR=R;const c=(R+r*(1-R))/I;y.push(c);if(c<best){best=c;bt=T}}const m=e*Math.exp(lg(1+1/b));return{o:`Optimal age T* ≈ <b>${bt.toFixed(0)} h</b><br>Cost rate at T*: ${ex(best)} (Cp/h)<br>Run-to-failure: ${ex(r/m)}<br>Saving vs run-to-failure: ${(100*(1-best*m/r)).toFixed(1)}%`,s:[{y:y.map(c=>Math.min(c,best*4)),n:'cost rate vs T (scaled)',c:'#2f7d4f'}],x:'replacement age T, 0 → 2η'}}},
sil:{in:[['l','λDU (FIT = 10⁻⁹/h)',500,10,5000,10],['ti','Proof-test interval (yr)',1,.25,10,.25],['bt','CCF β (%)',5,0,20,1],['ar','Architecture',0,['1oo1','1oo2']]],f(v){const x=v.l*1e-9*v.ti*8760,p=v.ar==0?x/2:x*x/3+v.bt/100*x/2,s=p<1e-4?'SIL 4':p<1e-3?'SIL 3':p<1e-2?'SIL 2':p<1e-1?'SIL 1':'below SIL 1';return{o:`PFDavg = <b>${ex(p)}</b> → ${s} (hardware PFD only)<br>Risk reduction factor = ${(1/p).toFixed(0)}`,s:[]}}},
mc:{in:[['b','Shape β',2,.5,5,.1],['e','Scale η (h)',1000,100,3000,100],['n','Components n',3,1,8,1],['k','k required',2,1,8,1],['t','Mission time (h)',500,10,3000,10]],f(v){const{b,e,n,t}=v,k=Math.min(v.k,n),N=4000,L=[];for(let s=0;s<N;s++){const a=[];for(let i=0;i<n;i++)a.push(e*(-Math.log(1-Math.random()))**(1/b));a.sort((x,y)=>x-y);L.push(a[n-k])}const R=x=>{const r=Math.exp(-((x/e)**b));let s=0;for(let i=k;i<=n;i++)s+=C(n,i)*r**i*(1-r)**(n-i);return s},emp=L.filter(x=>x>t).length/N,se=Math.sqrt(emp*(1-emp)/N),ys=[],ya=[];for(let i=1;i<=40;i++){const x=2*e*i/40;ys.push(L.filter(z=>z>x).length/N);ya.push(R(x))}return{o:`Simulated R(t) = <b>${emp.toFixed(4)}</b> ± ${(1.96*se).toFixed(4)} (95%, N=${N})<br>Analytic R(t) = ${R(t).toFixed(4)}<br>Mean system life ≈ ${(L.reduce((a,c)=>a+c)/N).toFixed(0)} h`,s:[{y:ys,n:'simulated',c:'#e8590c',abs:1},{y:ya,n:'analytic',c:'#1f4e79',abs:1}],x:'time 0 → 2η'}}},
deg:{in:[['D','Failure threshold D',100,10,200,5],['x','Current degradation',40,0,95,1],['u','Drift μ (/h)',.1,.01,1,.01],['s','Volatility σ (/√h)',.5,.05,3,.05]],f(v){const d=v.D-v.x,m=d/v.u,lam=d*d/(v.s*v.s),sd=Math.sqrt(m**3/lam),N=150,T=3*m,y=[],q={};let c=0,pf=0;for(let i=1;i<=N;i++){const t=T*i/N,g=Math.sqrt(lam/(2*Math.PI*t**3))*Math.exp(-lam*(t-m)**2/(2*m*m*t));y.push(g);c+=(g+pf)/2*(T/N);pf=g;for(const p of[.1,.5,.9])if(c>=p&&q[p]===undefined)q[p]=t}return{o:`Mean RUL = <b>${m.toFixed(0)} h</b> · SD ≈ ${sd.toFixed(0)} h<br>P10 / P50 / P90 ≈ ${(q[.1]||0).toFixed(0)} / ${(q[.5]||0).toFixed(0)} / ${(q[.9]||T).toFixed(0)} h<br>Plan maintenance near P10, not the mean.`,s:[{y,n:'RUL density (scaled)',c:'#2f7d4f'}],x:'remaining life 0 → 3× mean'}}}
};
const M=[
{l:0,t:'What is reliability?',tool:'weibull',b:`<p>Reliability <code>R(t)=P(T&gt;t)</code> is the probability an item performs its function for a stated time under stated conditions. Failure probability <code>F(t)=1−R(t)</code>.</p><p>The <b>hazard rate</b> <code>h(t)=f(t)/R(t)</code> is the instantaneous failure rate. The <b>bathtub curve</b> has infant mortality (h falling), useful life (h constant), and wear-out (h rising). Weibull shape β maps to these phases: β&lt;1, =1, &gt;1.</p><p>Move β in the tool and watch the hazard.</p>`,q:['A Weibull part has β = 3. What does that indicate?',['Infant mortality','Random failures','Wear-out','No failures'],2,'β>1 means the hazard rate rises with age: wear-out.']},
{l:0,t:'MTBF, MTTF & the exponential model',b:`<p>With constant hazard λ: <code>R(t)=e^(−λt)</code>, <code>MTTF=1/λ</code>. For repairable items we use MTBF; for non-repairable, MTTF.</p><p>Common trap: at <code>t=MTBF</code>, R is only <b>36.8%</b>, not 50% or 100%. MTBF is not a guaranteed life.</p><p>Try β=1 in the previous lesson's tool and set t=η.</p>`,tool:'weibull',q:['An item has MTBF = 1000 h (exponential). R(1000 h)?',['100%','63.2%','50%','36.8%'],3,'e^(−1) ≈ 0.368.']},
{l:0,t:'Series, parallel & k-of-n (RBD)',tool:'rbd',b:`<p>Reliability block diagrams combine components.</p><ul><li>Series: <code>R=ΠRᵢ</code> (all must work)</li><li>Parallel (redundant): <code>R=1−Π(1−Rᵢ)</code></li><li>k-of-n: binomial sum <code>Σᵢ₌ₖⁿ C(n,i)Rⁱ(1−R)ⁿ⁻ⁱ</code></li></ul><p>Series systems are weaker than their weakest part; parallel systems are stronger than their best.</p>`,q:['3 identical R=0.9 parts in series give R≈?',['0.90','0.729','0.999','0.81'],1,'0.9³ = 0.729.']},
{l:1,t:'FMEA / FMECA',tool:'fmea',b:`<p>Failure Mode and Effects (Criticality) Analysis is a <b>bottom-up, inductive</b> method: for each item, list failure modes → effects → causes → controls, then rank.</p><p><code>RPN=S×O×D</code> (1–10 each). Criticism: RPN is ordinal math, different combos give equal RPN. Modern practice (AIAG-VDA) uses <b>Action Priority</b> and always treats high severity first. FMECA adds quantitative criticality <code>Cm=α·β·λ·t</code> (MIL-STD-1629).</p>`,q:['Why is RPN criticized?',['It needs software','Equal RPNs can hide very different risks (e.g., S=10)','It uses probabilities','It is top-down'],1,'A severity of 10 with low O×D can tie with a trivial issue.']},
{l:1,t:'Fault Tree Analysis (FTA)',tool:'fta',b:`<p>FTA is <b>top-down, deductive</b>: start from an undesired top event, decompose with AND/OR gates down to basic events.</p><ul><li>AND: <code>P=ΠPᵢ</code></li><li>OR: <code>P=1−Π(1−Pᵢ)</code></li></ul><p><b>Minimal cut sets</b> are the smallest event combos that cause the top event. <b>Birnbaum importance</b> = <code>P(top|x=1)−P(top|x=0)</code> shows which basic event matters most. Rare-event approximation: sum of cut set probabilities.</p>`,q:['A cut set of order 1 means…',['One event alone causes the top event','Two events needed','Always unlikely','A repair'],0,'Single-point failures are first-order cut sets: fix those first.']},
{l:1,t:'Event Tree Analysis (ETA)',tool:'eta',b:`<p>ETA is <b>forward, inductive</b>: start from an initiating event and branch on success/failure of each safety barrier. Each path gives an outcome and frequency.</p><p><code>f(path)=f_init·Π(branch probabilities)</code></p><p>Used in process safety, nuclear PRA and the bow-tie method: FTA on the left (causes), ETA on the right (consequences).</p>`,q:['FTA vs ETA: ETA works…',['Backward from top event','Forward from an initiating event','Only on hardware','Without probabilities'],1,'ETA is forward-looking; FTA is backward.']},
{l:2,t:'Markov models & availability',tool:'markov',b:`<p>A continuous-time Markov chain has states (Up, Down) and constant transition rates. For a repairable unit: <code>dP/dt = P·Q</code>.</p><p>Two-state: <code>A(t)=μ/(λ+μ)+λ/(λ+μ)·e^(−(λ+μ)t)</code>, steady state <code>A=MTBF/(MTBF+MTTR)</code>.</p><p>Markov handles repair, standby, dependencies and degraded states that fault trees can't, but the state space grows exponentially (2ⁿ). The key assumption is the memoryless property (exponential holding times).</p>`,q:['Steady-state availability for MTBF=100 h, MTTR=10 h?',['0.90','0.91','0.99','0.50'],1,'100/110 = 0.909.']},
{l:2,t:'Repairable systems: NHPP & Crow-AMSAA',b:`<p>Repairable systems are modeled by <b>point processes</b>, not lifetime distributions. Key test: is the failure rate constant (HPP) or trending (NHPP)?</p><p>Power-law NHPP: <code>m(t)=λtᵝ</code>, intensity <code>u(t)=λβt^(β−1)</code>. β&lt;1: reliability growth; β&gt;1: deterioration. Don't confuse with Weibull distribution: the math is similar, the meaning is different (renewal vs. one repairable system).</p><p>Test trends with the Laplace test.</p>`,q:['NHPP with β<1 indicates…',['Deterioration','Reliability growth','Constant rate','Perfect repair'],1,'Intensity falls over time.']},
{l:2,t:'Common cause & beta-factor',b:`<p>Redundancy math assumes independence, but shared causes (power, environment, maintenance error, design flaw) break it.</p><p><b>β-factor model</b>: fraction β of a component's failure rate λ is common cause: <code>λ_ccf=βλ</code>, <code>λ_ind=(1−β)λ</code>. For a 2-parallel system, the CCF often dominates: <code>P≈ (λ_ind t)² + λ_ccf t</code>. Other models: MGL, alpha-factor.</p>`,tool:'rbd',q:['Why does CCF limit redundancy benefits?',['It makes parts cheaper','One shared cause fails all channels at once','It lowers λ','It adds repair'],1,'Redundant channels stop being independent.']},
{l:3,t:'Bayesian reliability',tool:'bayes',b:`<p>Combine prior knowledge with test data. For binomial pass/fail data with a Beta prior, posterior is conjugate: <code>Beta(α+k, β+n−k)</code>.</p><p>With zero failures, classical estimates give 0 or wide bounds; Bayes with an informative prior (from similar fielded units) yields usable estimates, but the prior must be justified and sensitivity-tested. Hierarchical models pool across fleets; MCMC handles non-conjugate cases.</p>`,q:['Prior Beta(1,1), 20 tests, 0 failures. Posterior mean failure prob?',['0','1/22','1/21','1/20'],1,'(1+0)/(1+1+20)=1/22.']},
{l:3,t:'Accelerated life testing',tool:'arr',b:`<p>Test at higher stress to induce failures quickly, then extrapolate to use conditions via a life–stress model.</p><ul><li><b>Arrhenius</b> (temperature): <code>AF=exp[(Ea/k)(1/Tu−1/Ts)]</code>, k=8.617e−5 eV/K</li><li>Inverse power law (voltage), Eyring, Peck (temp+humidity), Coffin–Manson (thermal cycling)</li></ul><p>Key assumption: <b>failure mechanism is unchanged</b> at stress. Extrapolation is the dominant uncertainty.</p>`,q:['Biggest risk in ALT?',['Too few units only','Stress activates a different failure mechanism','Weibull is wrong','Arrhenius is too simple to compute'],1,'Different mechanism makes the extrapolation invalid.']},
{l:3,t:'Research frontiers',b:`<p>Topics for PhD-level work:</p><ul><li><b>Dynamic fault trees</b> (PAND, SPARE, FDEP gates) solved via Markov chains or Monte Carlo</li><li><b>Semi-Markov / Markov renewal</b> processes for non-exponential repair</li><li><b>Imperfect repair</b>: Kijima virtual age models, geometric process</li><li><b>Dependence</b>: copulas, competing risks, shock models</li><li><b>Prognostics & Health Management</b>: RUL estimation, degradation (Wiener, gamma processes), particle filters</li><li><b>Importance measures</b>: Birnbaum, Fussell–Vesely, RAW/RRW, uncertainty propagation</li><li><b>Resilience</b> and reliability of ML/software systems</li></ul><p>Read: Rausand & Høyland (<i>System Reliability Theory</i>), Meeker & Escobar (<i>Statistical Methods for Reliability Data</i>), Modarres (<i>Reliability Engineering and Risk Analysis</i>).</p>`,q:['Which model fits degradation with monotone increments?',['Wiener process','Gamma process','Poisson with β=1','Beta-binomial'],1,'Gamma processes have non-negative independent increments.']},
{l:1,t:'Life data analysis: censoring & MLE',b:`<p>Field data is mostly <b>censored</b>: units still running (right-censored) or failures known only to lie in an interval. Dropping suspensions discards survivors and biases life estimates pessimistically.</p><p>Likelihood: <code>L=Πf(tᵢ)·ΠR(tⱼ)·Π[F(uₖ)−F(lₖ)]</code> for failures, suspensions and intervals. Weibull MLE is solved numerically; bounds come from Fisher information or likelihood-ratio contours. Median-rank regression (Benard: <code>(i−0.3)/(n+0.4)</code>) suits small samples, MLE suits heavy censoring.</p><p>Check fit on probability plots, compare models by AIC/BIC, and separate competing failure modes before fitting.</p>`,q:['Why not just drop suspended units?',['They carry no information','It biases life estimates low because survivors are discarded','It is not allowed','It inflates β'],1,'Survivors are evidence of long life; ignoring them makes the product look worse than it is.']},
{l:2,t:'Maintenance & age replacement',tool:'age',b:`<p>Preventive maintenance pays only if the hazard is <b>increasing</b> and failures cost much more than planned replacement. Age replacement renews at age T or at failure, whichever comes first. By the renewal-reward theorem the long-run cost rate is <code>C(T)=[Cp·R(T)+Cf·F(T)]/∫₀ᵀR(t)dt</code>.</p><p>For β≤1 a fixed-age replacement cannot help: a part with constant or falling hazard gains nothing from renewal. Other policies: block replacement, condition-based maintenance, inspection intervals for hidden failures, and RCM decision logic.</p>`,q:['Age replacement is worthwhile when…',['Hazard is decreasing','Hazard increases and Cf ≫ Cp','Failures are random (β=1)','Repair is imperfect'],1,'Only wear-out plus costly failures makes early renewal profitable.']},
{l:2,t:'Functional safety & SIL (IEC 61508)',tool:'sil',b:`<p>IEC 61508/61511 define <b>Safety Integrity Levels</b> by average probability of failure on demand (low-demand mode): SIL1 10⁻²–10⁻¹, SIL2 10⁻³–10⁻², SIL3 10⁻⁴–10⁻³, SIL4 10⁻⁵–10⁻⁴.</p><p>Simplified: 1oo1 <code>PFDavg≈λDU·TI/2</code>; 1oo2 <code>≈(λDU·TI)²/3+β·λDU·TI/2</code>. A SIL claim also needs <b>architectural constraints</b> (hardware fault tolerance, safe failure fraction), <b>systematic capability</b> and a safety lifecycle. Sector relatives: ISO 26262 (automotive ASIL), ARP4761/DO-178C (aviation), EN 50126 (rail).</p>`,q:['In a 1oo2 architecture, what usually limits PFD improvement?',['Proof-testing too often','Common cause (β-factor)','Low λDU','Nothing'],1,'The β term does not shrink with redundancy.']},
{l:3,t:'Monte Carlo simulation',tool:'mc',b:`<p>When closed forms fail (repair logistics, dependence, standby switching, non-exponential behaviour, phased missions) simulate. Draw lifetimes by <b>inverse transform</b>: for Weibull, T=η(−ln U)<sup>1/β</sup> with U uniform. Simulate the system logic, repeat N times, and estimate R(t) as the surviving fraction.</p><p>Error shrinks as 1/√N: the 95% half-width is 1.96√(R(1−R)/N), so 4× the runs halves the error. Rare events need <b>variance reduction</b>: importance sampling, stratification, splitting, antithetic variates. Compare designs with <b>common random numbers</b>. Always validate a simulator on a case with a known analytic answer, as the tool does here.</p>`,q:['To halve the Monte Carlo standard error you need…',['2× the samples','4× the samples','Half the samples','A new seed'],1,'Error ∝ 1/√N.']},
{l:3,t:'Degradation modelling & remaining useful life',tool:'deg',b:`<p>For many items failure is a degradation path crossing a threshold D. A <b>Wiener process</b> X(t)=μt+σB(t) has first-passage time to the threshold that is <b>inverse Gaussian</b> with mean (D−x)/μ and shape (D−x)²/σ². Remaining useful life (RUL) is this conditional distribution, updated as new measurements arrive (Bayesian update of μ, σ, or Kalman and particle filters).</p><p>A Wiener path can decrease, so <b>gamma processes</b> suit monotone wear. Prognostics approaches: physics-based, data-driven, hybrid. Judge them by prognostic horizon and α–λ accuracy. For decisions use a lower quantile (e.g., P10) because the cost of an unplanned failure usually exceeds the cost of early action; the width of the distribution matters as much as its mean.</p>`,q:['For RUL-based scheduling the safer planning point is…',['Mean RUL','A lower quantile such as P10','Maximum RUL','Fleet median'],1,'It protects against the costly early-failure tail.']}
];

const G=`<details class=card><summary><b>Glossary & formulas</b></summary><p><b>MTTF/MTBF/MTTR</b>: mean time to failure, between failures (repairable), to repair. <b>Availability</b>: A=MTBF/(MTBF+MTTR). <b>B10</b>: time by which 10% fail. <b>FIT</b>: failures per 10⁹ h.</p><p><b>Cut set</b>: events whose joint failure fails the system; <b>path set</b>: events whose success ensures it. <b>Birnbaum</b>: ∂P/∂pᵢ. <b>PFD</b>: probability of failure on demand. <b>SIL</b>: safety integrity level. <b>CCF</b>: common-cause failure. <b>AF</b>: acceleration factor. <b>RUL</b>: remaining useful life. <b>NHPP</b>: non-homogeneous Poisson process.</p><p><code>Exp: R=e^(−λt)</code> <code>Weibull: R=e^(−(t/η)^β)</code> <code>Series: ΠR</code> <code>Parallel: 1−Π(1−R)</code> <code>Two-state Markov A=μ/(λ+μ)</code> <code>PFD(1oo1)=λDU·TI/2</code></p></details>`;

1:`λ=2×10⁻⁴ /h (MTBF 5000 h). A 100 h mission: R=e^(−0.02)=0.980. Time to R=0.90 is −ln(0.9)/λ≈527 h, about 10% of MTBF. <i>Pitfall:</i> MTBF is not life.`,
2:`Three R=0.9 parts: series 0.729; parallel 0.999; 2-of-3 = 3R²−2R³ = 0.972. <i>Pitfall:</i> these assume independent failures (see common cause).`,
3:`Mode A: S=9, O=2, D=3 → RPN 54. Mode B: S=3, O=6, D=6 → RPN 108. RPN ranks B first although A is safety-critical, which is why Action Priority reviews severity first.`,

5:`f=0.1/yr, barriers 0.99 and 0.9. Safe 0.099/yr; mitigated 9×10⁻⁴/yr; accident 0.1×0.01×0.1 = 1×10⁻⁴/yr. <i>Pitfall:</i> barriers are often dependent (shared power, same operator).`,
6:`λ=0.01, μ=0.1 /h: A=0.1/0.11=0.909. The chain relaxes to steady state with time constant 1/(λ+μ)≈9.1 h. For two parallel units with one repair crew, use states 0, 1 or 2 failed with rates 2λ, λ, μ, and solve πQ=0, Σπ=1.`,

const D={
0:`<p>Four functions describe the same random lifetime T: density f(t), cumulative F(t), reliability R(t)=1−F(t), and hazard h(t)=f(t)/R(t). The hazard is a <i>conditional</i> rate: the chance of failing in the next instant given survival to t. Integrating gives the cumulative hazard H(t), and R(t)=exp[−H(t)]. Any shape of h(t) therefore defines a distribution.</p><p>Bathtub phases have physical causes: <b>infant mortality</b> (latent manufacturing defects, handled by burn-in and screening), <b>useful life</b> (random overstress events), <b>wear-out</b> (fatigue, corrosion, wear, insulation ageing). A fleet mixing defective and sound units, or several failure modes, produces a bathtub even though each mode alone is simple.</p><p>Weibull: β sets the shape, η is the <b>characteristic life</b> at which 63.2% have failed for any β, and an optional location γ delays onset. Reliability is always tied to a definition of failure, a mission time and an environment.</p>`,
1:`<p>The exponential is <b>memoryless</b>: P(T&gt;t+s | T&gt;t)=P(T&gt;s), so an old part is as good as a new one. That is plausible for random electronic failures and wrong for wearing mechanical parts. When components in series are all exponential, rates add: λ<sub>sys</sub>=Σλᵢ. This underlies parts-count prediction (MIL-HDBK-217, Telcordia, FIDES), which gives a planning estimate and not a field guarantee.</p><p><b>Demonstration testing:</b> for a time-terminated test with r failures and total test time T, a one-sided lower confidence bound on MTBF is 2T/χ²(C; 2r+2). Zero-failure success-run testing needs n=ln(1−C)/ln(R) units; for R=0.9 at 90% confidence that is 22 units. Quote reliability at a time (or a B10 life, when 10% have failed) instead of MTBF alone.</p>`,
2:`<p>A <b>structure function</b> φ(x) maps component states (0/1) to system state; coherent systems never get better when a component fails. <b>Path sets</b> are component sets whose working guarantees success; <b>cut sets</b> are sets whose failure guarantees system failure. Block diagrams and fault trees are dual views of the same logic.</p><p>Redundancy types: active (all units running), standby (cold, warm, hot) with possible switching failure. Two identical cold-standby units with perfect switching and exponential life give R=e<sup>−λt</sup>(1+λt). Series-parallel reduction fails for bridge networks, so condition on a key component or use path-set inclusion–exclusion. For the same parts, redundancy at the <i>component</i> level beats redundancy at the system level, but costs more interfaces.</p>`,
3:`<p>Modern FMEA (AIAG-VDA) follows six steps: planning and scope, structure analysis, function analysis, failure analysis, risk analysis, optimization, then documentation. The failure chain links <b>failure mode → effect → cause</b> across three levels: the item itself, the next higher level, and the end effect on the user or system.</p><p>Ratings: <b>Severity</b> scores the end effect; <b>Occurrence</b> scores how likely the cause is given prevention controls; <b>Detection</b> scores how well detection controls would find the cause or mode before release. Prevention and detection must be listed separately. Action Priority (H/M/L) replaces RPN thresholds and looks at severity first.</p><p>FMECA adds quantified criticality: Cm=β·α·λp·t (conditional loss probability, mode ratio, part failure rate, time), summed per item as Cr. <b>Limits:</b> single failures only, weak on interactions and human error, and quality depends on a cross-functional team. Pair it with FTA, HAZOP or STPA.</p>`,
4:`<p>Procedure: define the top event, system boundary and resolution; decompose with gates (AND, OR, voting k/n, INHIBIT) down to basic events with data. <b>Qualitative step:</b> Boolean reduction yields minimal cut sets (MOCUS algorithm; absorption A+AB=A). Single-event cut sets are single points of failure and rank order by size.</p><p><b>Quantitative step:</b> exact evaluation uses binary decision diagrams. Approximations: rare-event (sum of cut set probabilities, an upper bound) and the min-cut upper bound 1−Π[1−P(MCSⱼ)]. Repeated events must be handled in Boolean form, never by multiplying gate outputs that share events.</p><p><b>Importance:</b> Birnbaum (sensitivity), Fussell–Vesely (share of the top event from cut sets containing the event), RAW (risk achievement worth), RRW (risk reduction worth). For periodically tested standby items use q≈λτ/2; for non-repairable q(t)=1−e<sup>−λt</sup>.</p>`,
5:`<p>Elements: <b>initiating event</b> (with frequency per year), <b>pivotal events</b> (barriers, human actions, system responses) in time order, branches (success/failure), and <b>end states</b> grouped into consequence classes. Branch probabilities are <i>conditional</i> on earlier branches; if barrier 2 shares power with barrier 1, its failure probability after barrier 1 fails is higher than its stand-alone value.</p><p>Check: end-state frequencies must sum to the initiating frequency (0.099+0.0009+0.0001=0.1). In nuclear and process PRA, event trees are linked to fault trees that supply barrier failure probabilities. <b>Bow-tie</b> diagrams put the fault tree (causes) and event tree (consequences) around one top event. <b>LOPA</b> is the simplified form: initiating frequency × PFD of each independent protection layer, compared against a tolerable frequency.</p>`,
6:`<p>A continuous-time Markov chain is defined by a generator matrix Q: off-diagonal qᵢⱼ are transition rates, and each row sums to zero. State probabilities obey dP/dt=PQ, so P(t)=P(0)e<sup>Qt</sup>. <b>Steady state</b> solves πQ=0 with Σπ=1. For reliability, make the system-failed states <b>absorbing</b>; then MTTF=P(0)(−Q<sub>T</sub>)<sup>−1</sup>1, where Q<sub>T</sub> is the transient block. Availability models have no absorbing state.</p><p>Two identical units, one repairman, repair possible while one unit works: MTTF=(3λ+μ)/(2λ²). Doubling μ nearly doubles MTTF, which shows the value of fast repair.</p><p><b>Limits:</b> state space grows as 2<sup>n</sup>; exponential holding times only. Remedies: state truncation or lumping, phase-type approximations, semi-Markov models, stochastic Petri nets, Monte Carlo simulation.</p>`,
7:`<p>Repair quality defines the model: <b>perfect repair</b> (as good as new) gives a renewal process with iid inter-failure times; <b>minimal repair</b> (as bad as old) gives an NHPP; <b>imperfect repair</b> falls between (Kijima virtual-age models, geometric process).</p><p>Power-law NHPP, time-truncated at T with n failures at tᵢ: β̂=n/Σln(T/tᵢ), λ̂=n/T<sup>β̂</sup>. Current intensity u(T)=λβT<sup>β−1</sup>, and the instantaneous MTBF is 1/u(T). The Duane/Crow-AMSAA form is the standard for reliability-growth programs. Test trend with the Laplace test: U=(Σtᵢ/n−T/2)/(T/√(12n)); U&gt;1.96 means deterioration, U&lt;−1.96 growth (5% level). For fleets plot the <b>mean cumulative function</b> (MCF); check fit with Cramér–von Mises.</p>`,
8:`<p>Common-cause failures (CCF) come from shared design, environment, power, maintenance, calibration errors or software. Defenses: diversity, physical separation, staggered testing and maintenance, procedures, training.</p><p>Models: <b>β-factor</b> (single fraction, typically 1–10% for engineered systems); <b>MGL</b> (multiple Greek letter: β, γ, δ for failures of 2, 3, 4 channels); <b>alpha-factor</b> (estimated from event counts, preferred in PRA); <b>binomial failure rate</b> with lethal shocks. In a fault tree, an AND of redundant channels gets an extra OR input: a CCF basic event shared by all channels, which turns the system's single-point behaviour visible. Estimates rely on CCF event databases (e.g., ICDE); expert judgment alone is the weakest option.</p>`,
9:`<p>Bayes' theorem: posterior ∝ prior × likelihood. Beta(a,b) behaves like a+b pseudo-observations, so a strong prior needs strong data to move it. For failure-time data with exponential life and a Gamma(a,b) prior on λ, the posterior is Gamma(a+r, b+T) for r failures over total time T.</p><p>Prior sources: earlier generations, similar fielded fleets, physics-of-failure models, expert elicitation. Defaults: uniform Beta(1,1) or Jeffreys Beta(0.5,0.5). <b>Credible intervals</b> are direct probability statements about the parameter, unlike confidence intervals. Extensions: power priors (discount old data), hierarchical models that partially pool fleets or lots, MCMC (Stan, JAGS) for non-conjugate models.</p><p>Pitfalls: prior–data conflict, using the same data twice, and unreported prior sensitivity.</p>`,
10:`<p>Design: constant-stress (several fixed levels, ≥3 recommended), step-stress, ramp. <b>HALT</b> is qualitative: find design margins and weak points. <b>ALT</b> is quantitative: fit a life distribution at each stress (often Weibull with a common β) and a life–stress relationship for η(S).</p><ul><li>Arrhenius: temperature-driven chemistry; typical Ea 0.3–1.0 eV</li><li>Eyring: adds a temperature pre-factor and handles other stresses</li><li>Inverse power law: η∝V<sup>−n</sup> for voltage or load</li><li>Peck: temperature plus humidity</li><li>Coffin–Manson: cycles to failure ∝ Δε<sup>−c</sup>; Miner's rule Σn/N=1 for cumulative damage</li></ul><p>Main risks: guessing Ea, a changed failure mechanism at high stress, too few stress levels, and extrapolating far beyond the data.</p>`,
11:`<ul><li><b>Degradation models:</b> a Wiener process with drift μ and volatility σ reaching a threshold D has an inverse-Gaussian first-passage time; gamma processes model monotone wear. Remaining useful life (RUL) is the conditional distribution of the time to threshold, updated with Kalman or particle filters.</li><li><b>Dependence:</b> copulas (Clayton for lower-tail, Gumbel for upper-tail dependence), Marshall–Olkin shock models.</li><li><b>Imperfect repair:</b> Kijima I: Vₙ=Vₙ₋₁+qXₙ; type II: Vₙ=q(Vₙ₋₁+Xₙ), with q=0 perfect and q=1 minimal repair.</li><li><b>Dynamic fault trees</b> with sequence-dependent gates, solved by Markov chains, Bayesian networks or simulation.</li><li><b>Uncertainty:</b> separate aleatory from epistemic uncertainty and propagate it through the model.</li></ul>`,
12:`<p>The nonparametric <b>Kaplan–Meier</b> estimator is R̂(t)=Π(1−dᵢ/nᵢ) over failure times, where nᵢ is the number still at risk; censored units leave the risk set without a step. Fleet data often has <b>left truncation</b> (units enter observation at some age) and warranty data has reporting delay and unknown usage.</p><p>For multiple failure modes, fit each mode separately and treat the other modes as censoring; combine as competing risks. Be careful with the three-parameter Weibull: the location parameter is poorly identified with small samples. Report confidence bounds and, for decisions, compare candidate models with likelihood-based criteria.</p>`,
13:`<p>Per cycle, the expected cost is Cp·R(T)+Cf·F(T) and the expected length is E[min(T,X)]=∫₀ᵀR dt. Setting dC/dT=0 gives the optimality condition h(T)·∫₀ᵀR dt − F(T) = Cp/(Cf−Cp): the larger the cost ratio, the earlier the replacement.</p><p>Alternatives: <b>block replacement</b> (fixed calendar, simpler logistics, replaces young parts), <b>condition-based maintenance</b> using a P–F interval (inspect more often than the time from detectable degradation to failure), inspection of hidden failures (unavailability ≈λτ/2, so shorten τ when the failure is costly), and <b>RCM</b> decision logic that asks whether a task is technically feasible and worth doing.</p>`,
14:`<p>Two modes: <b>low demand</b> (PFDavg, as in the tool) and <b>high demand/continuous</b> (PFH per hour: SIL1 10⁻⁶–10⁻⁵, SIL2 10⁻⁷–10⁻⁶, SIL3 10⁻⁸–10⁻⁷, SIL4 10⁻⁹–10⁻⁸).</p><p>Failures are classed safe/dangerous and detected/undetected (λSD, λSU, λDD, λDU). Safe failure fraction SFF=(λS+λDD)/(λS+λD). The permissible SIL depends on SFF, hardware fault tolerance (HFT) and element type (Type A or B). Proof tests below 100% coverage let undetected failures accumulate until overhaul; include mission time and repair time.</p><p>Lifecycle: hazard and risk assessment (LOPA, risk graph) → SIL target → design → verification → validation → operation and modification control. Systematic failures (specification, software) are controlled by process rigor, not by probabilities.</p>`
};
const L=['Beginner','Intermediate','Advanced','PhD'];let f=-1,done=[];
try{done=JSON.parse(localStorage.getItem('rel')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('rel',JSON.stringify(done))}catch(e){}};
function home(){const p=Math.round(100*done.length/M.length);let h=`<h1>Reliability Academy</h1><p class=mu>A graduate-level curriculum in reliability, availability and risk analysis, from first principles to research methods. Each lesson has theory, a worked example, an interactive model and a check question.</p><div class=bar><i style="width:${p}%"></i></div><p class=mu>${done.length}/${M.length} lessons complete · <a href=# onclick="exam();return false">Take the final exam</a> (best ${bestx()}/10)</p><div class=chips>`+['All',...L].map((x,i)=>`<button class="chip ${f==i-1?'on':''}" onclick="f=${i-1};home()">${x}</button>`).join('')+'</div>';
M.map((m,i)=>[m,i]).sort((a,b)=>a[0].l-b[0].l).forEach(([m,i])=>{if(f>=0&&m.l!=f)return;h+=`<div class="card m" onclick="open_(${i})"><span class="dot ${done.includes(i)?'d':''}">${done.includes(i)?'✓':''}</span><span><b>${m.t}</b><span class=mu>${L[m.l]}${m.tool?' · interactive tool':''}</span></span></div>`});h+=G;$('#app').innerHTML=h;scrollTo(0,0)}
let cur;
function open_(i){cur=i;const m=M[i];let h=`<button class=btn onclick="home()">← All lessons</button><div class=mu>${L[m.l]}</div><h2>${m.t}</h2>${m.b}${D[i]?'<p><b>In depth</b></p>'+D[i]:''}${X[i]?'<div class=card><b>Worked example</b><br>'+X[i]+'</div>':''}`;
if(m.tool){const t=T[m.tool];h+='<div class=card><b>Try it</b>'+t.in.map(x=>Array.isArray(x[3])?`<label>${x[1]}<select data-k=${x[0]}>${x[3].map((o,j)=>`<option value=${j} ${j==x[2]?'selected':''}>${o}</option>`).join('')}</select></label>`:`<label>${x[1]}: <b id=v_${x[0]}>${x[2]}</b><input type=range data-k=${x[0]} min=${x[3]} max=${x[4]} step=${x[5]} value=${x[2]}></label>`).join('')+'<div id=out></div><svg id=ch viewBox="0 0 300 150"></svg></div>'}
cq=[m.q,...(Q2[i]||[])];sc=0;ansd=0;h+=qhtml();
$('#app').innerHTML=h;scrollTo(0,0);if(m.tool){$('#app').oninput=()=>upd(m.tool);upd(m.tool)}}
function upd(k){const t=T[k],v={};document.querySelectorAll('[data-k]').forEach(e=>{v[e.dataset.k]=+e.value;const s=$('#v_'+e.dataset.k);if(s)s.textContent=e.value});const r=t.f(v);$('#out').innerHTML=r.o;let g='';
if(r.s.length){r.s.forEach((s,i)=>{const mx=s.abs?1:Math.max(...s.y)||1,n=s.y.length;g+=`<polyline fill=none stroke="${s.c}" stroke-width=2 points="${s.y.map((y,j)=>`${15+j*280/(n-1)},${115-100*y/mx}`).join(' ')}"/><text x=${15+i*95} y=10 font-size=10 fill="${s.c}">● ${s.n}</text>`});g+=`<line x1=15 y1=115 x2=295 y2=115 stroke="#888"/><line x1=15 y1=15 x2=15 y2=115 stroke="#888"/><text x=15 y=135 font-size=10 fill="#888">${r.x}</text>`}$('#ch').innerHTML=g}
let cq=[],sc=0,ansd=0;const bestx=()=>{try{return localStorage.getItem('relx')||0}catch(e){return 0}};
const qhtml=()=>cq.map((q,k)=>`<div class=card id=q${k}><b>Question ${k+1} of ${cq.length}</b><p>${q[0]}</p>`+q[1].map((o,j)=>`<button class=opt onclick="ans(${k},${j},this)">${o}</button>`).join('')+'<div class=mu></div></div>').join('');
function exam(){cur=-1;cq=M.flatMap((m,i)=>[m.q,...(Q2[i]||[])]).sort(()=>Math.random()-.5).slice(0,10);sc=0;ansd=0;$('#app').innerHTML='<button class=btn onclick="home()">← All lessons</button><h2>Final exam</h2><p class=mu>10 random questions drawn from every lesson. Pass mark 70%.</p>'+qhtml();scrollTo(0,0)}
function ans(k,j,b){const q=cq[k],c=$('#q'+k),os=c.querySelectorAll('.opt');os.forEach(x=>x.disabled=true);const ok=j==q[2];b.classList.add(ok?'r':'w');if(!ok)os[q[2]].classList.add('r');c.lastChild.innerHTML=(ok?'✅ Correct. ':'❌ Not quite. ')+q[3];if(ok)sc++;if(++ansd==cq.length){const xm=cur<0,p=sc>=Math.ceil(cq.length*(xm?.7:.6));if(!xm&&p&&!done.includes(cur)){done.push(cur);save()}if(xm)try{localStorage.setItem('relx',Math.max(+bestx(),sc))}catch(e){}$('#q'+(cq.length-1)).insertAdjacentHTML('afterend',`<div class=card><b>Score ${sc}/${cq.length}</b> · ${p?(xm?'Passed 🎓':'Lesson complete ✓'):'Not yet. Review the lesson and try again.'}</div>`)}}
home();
</script></body></html>
